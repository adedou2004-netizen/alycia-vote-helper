name: Alycia hourly rank capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alycia-rank-capture.yml"
      - "scripts/capture-rank.mjs"
  schedule:
    # Run every hour at 7 minutes past the hour.
    # Using :07 avoids the heavy GitHub Actions load that often occurs at :00.
    - cron: "7 * * * *"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and save Top-20 ranking
        env:
          ALYCIA_CAPTURE_TOKEN: ${{ secrets.ALYCIA_CAPTURE_TOKEN }}
        run: node scripts/capture-rank.mjs

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alycia-rank-capture-${{ github.run_id }}
          path: |
            capture-evidence.png
            capture-failure.png
          if-no-files-found: ignore
          retention-days: 14
